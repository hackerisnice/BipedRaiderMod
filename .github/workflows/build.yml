name: Build BipedRaiderMod

on:
  workflow_dispatch:   # 允许手动触发
  push:
    branches: [ "1.21" ]
  pull_request:
    branches: [ "1.21" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4

      # 2. 设置 JDK 21 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 设置 Gradle 缓存与自动配置
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. 修复 gradlew 可执行权限（Linux 环境必须）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 执行 Gradle 构建（编译、打包模组）
      - name: Build with Gradle
        run: ./gradlew build

      # 6. 上传构建产物（模组 JAR 文件）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BipedRaiderMod-Artifact
          path: build/libs/*.jar
