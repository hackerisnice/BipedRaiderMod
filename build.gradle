buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.yourmod'
archivesBaseName = 'bipedraidermod'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    // 使用最新的 1.21 Mappings
    mappings channel: 'official', version: '1.21'
    // 若使用 Parchment 映射，可改为：
    // mappings channel: 'parchment', version: '2024.06.16-1.21'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                bipedraidermod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                bipedraidermod {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'bipedraidermod', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                bipedraidermod {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 如果你需要额外依赖，可以放在这里
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21-51.0.33'
    // 如需使用其他模组作为可选依赖：
    // implementation fg.deobf("some.mod:example:1.21-1.0.0")
}

// 处理资源的替换变量
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.21',
            forge_version: '51.0.33',
            mod_id: 'bipedraidermod',
            mod_name: 'Biped Raider Mod',
            mod_version: '1.0.0',
            mod_authors: 'YourName'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": "bipedraidermod",
                "Specification-Vendor": "YourName",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "YourName"
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}